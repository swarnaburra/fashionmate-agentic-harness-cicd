name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  change-type-check:
    name: Change Classifier
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.classify.outputs.changed-files }}
      requires-governed-check: ${{ steps.classify.outputs.requires-governed-check }}
      touches-policy: ${{ steps.classify.outputs.touches-policy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            else
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            fi
          fi

          CHANGED_ONELINE=$(echo "$CHANGED" | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          echo "changed-files=$CHANGED_ONELINE" >> "$GITHUB_OUTPUT"

          # Files that affect agent behavior, tool contracts, evals, or governance.
          if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qE '^(\.github/workflows/|\.agents/|\.skills/|\.claude/agents/|agents/|skills/|mcp/|mcp-servers/|eval/|CLAUDE\.md|docs/governance-policy\.md|docs/routing-and-tool-grant-map\.md|scripts/)'; then
            echo "requires-governed-check=true" >> "$GITHUB_OUTPUT"
          else
            echo "requires-governed-check=false" >> "$GITHUB_OUTPUT"
          fi

          # Policy/access-control-relevant files.
          if echo "$CHANGED" | grep -qE '^(docs/governance-policy\.md|mcp-servers/.*/allow-list\.json|scripts/run-agent\.sh|\.skills/)'; then
            echo "touches-policy=true" >> "$GITHUB_OUTPUT"
          else
            echo "touches-policy=false" >> "$GITHUB_OUTPUT"
          fi

  policy-gate:
    name: Policy Test Suite
    runs-on: ubuntu-latest
    needs: change-type-check
    continue-on-error: true  # DELIBERATE WEAKENING for integrity test - do not merge
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build course container
        run: docker build -t agentic_engineer_4 .

      - name: Run policy tests
        run: |
          mkdir -p ci-artifacts
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            -v "$GITHUB_WORKSPACE/ci-artifacts":/reports \
            -w /workspace \
            agentic_engineer_4 \
            python -m pytest eval/test_policy.py -v \
              --json-report \
              --json-report-file=/reports/policy-report.json

      - name: Upload policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-report
          path: ci-artifacts/policy-report.json
          retention-days: 90
          if-no-files-found: ignore

  governed-file-gate:
    name: Governed File Check
    runs-on: ubuntu-latest
    needs: [change-type-check, policy-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: needs.change-type-check.outputs.requires-governed-check == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build course container
        if: needs.change-type-check.outputs.requires-governed-check == 'true'
        run: docker build -t agentic_engineer_4 .

      - name: Run governed-file checks
        if: needs.change-type-check.outputs.requires-governed-check == 'true'
        run: |
          mkdir -p ci-artifacts
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            -v "$GITHUB_WORKSPACE/ci-artifacts":/reports \
            -w /workspace \
            agentic_engineer_4 \
            python -m pytest eval/test_governed_files.py -v \
              --json-report \
              --json-report-file=/reports/governed-file-report.json

      - name: Upload governed-file report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-file-report
          path: ci-artifacts/governed-file-report.json
          retention-days: 90
          if-no-files-found: ignore

  advisory-review:
    name: Advisory Code Review
    runs-on: ubuntu-latest
    needs: [change-type-check, policy-gate]
    if: github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build course container
        run: docker build -t agentic_engineer_4 .

      - name: Run advisory agentic review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHANGED_FILES: ${{ needs.change-type-check.outputs.changed-files }}
        run: |
          mkdir -p ci-out ci-artifacts
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            -v "$GITHUB_WORKSPACE/ci-out":/out \
            -w /workspace \
            -e OPENROUTER_API_KEY \
            -e CHANGED_FILES \
            agentic_engineer_4 \
            python scripts/run-reviewer.py

          cp -r ci-out/. ci-artifacts/ 2>/dev/null || true

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ci-out/review-output.md ]; then
            python3 scripts/upsert_pr_comment.py "${{ github.event.pull_request.number }}" "<!-- ci:advisory-review -->" ci-out/review-output.md
          fi

      - name: Upload advisory review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisory-review
          path: ci-artifacts/
          retention-days: 90
          if-no-files-found: ignore

  eval-gate:
    name: Evaluation Harness
    runs-on: ubuntu-latest
    needs: [change-type-check, policy-gate]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Report skip for non-agent changes
        if: needs.change-type-check.outputs.requires-governed-check != 'true'
        run: echo "No agent-affecting files changed; harness skipped."

      - name: Free disk space
        if: needs.change-type-check.outputs.requires-governed-check == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build course container
        if: needs.change-type-check.outputs.requires-governed-check == 'true'
        run: docker build -t agentic_engineer_4 .

      - name: Run deterministic harness (gating)
        if: needs.change-type-check.outputs.requires-governed-check == 'true'
        timeout-minutes: 10
        run: |
          mkdir -p ci-artifacts
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            -v "$GITHUB_WORKSPACE/ci-artifacts":/reports \
            -w /workspace \
            agentic_engineer_4 \
            python -m pytest eval/test_deterministic.py eval/test_deterministic_router.py eval/test_deterministic_step.py eval/test_audit_trail.py -v -p no:cacheprovider \
              --json-report \
              --json-report-file=/reports/deterministic-report.json

      - name: Run rubric harness (advisory)
        if: needs.change-type-check.outputs.requires-governed-check == 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p ci-artifacts
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            -v "$GITHUB_WORKSPACE/ci-artifacts":/reports \
            -w /workspace \
            -e OPENROUTER_API_KEY \
            agentic_engineer_4 \
            python -m pytest eval/test_rubric_suite.py -v -p no:cacheprovider \
              --json-report \
              --json-report-file=/reports/rubric-report.json

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: ci-artifacts/*-report.json
          retention-days: 90
          if-no-files-found: ignore
  
  # GATING (permanent, required status check): fails the run if ci.yml has been
  # weakened - a gate given continue-on-error, a gate switched off with a job-level
  # if, the classifier deleted, audit-trail losing if: always(), and more (see
  # docs/ci-step-design.md). It checks the PR's own ci.yml and runs even when
  # other jobs fail. Never demote to advisory.
  pipeline-integrity:
    name: Pipeline Integrity Check
    runs-on: ubuntu-latest
    needs: [change-type-check, policy-gate]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependencies
        run: python -m pip install --quiet pyyaml==6.0.2 pytest==8.3.3

      - name: Check workflow integrity
        run: python scripts/check_pipeline_integrity.py .github/workflows/ci.yml --report ci-artifacts/pipeline-integrity-report.json

      - name: Self-test the checker against weakened workflows
        if: always()
        run: python -m pytest eval/test_pipeline_integrity.py -q -p no:cacheprovider

      - name: Upload pipeline integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-integrity-report
          path: ci-artifacts/pipeline-integrity-report.json
          retention-days: 90
          if-no-files-found: ignore

  audit-trail:
    name: Audit Trail
    runs-on: ubuntu-latest
    needs: [change-type-check, policy-gate, governed-file-gate, eval-gate, advisory-review, pipeline-integrity]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts
          merge-multiple: true

      - name: Build audit trail
        env:
          CHANGED_FILES: ${{ needs.change-type-check.outputs.changed-files }}
        run: |
          python3 scripts/build-audit-trail.py \
            --sha "${{ github.sha }}" \
            --event "${{ github.event_name }}" \
            --pr "${{ github.event.pull_request.number || 0 }}" \
            --changed-files "$CHANGED_FILES" \
            --touches-policy "${{ needs.change-type-check.outputs.touches-policy }}" \
            --requires-governed-check "${{ needs.change-type-check.outputs.requires-governed-check }}" \
            --policy-result "${{ needs.policy-gate.result }}" \
            --governed-result "${{ needs.governed-file-gate.result }}" \
            --review-result "${{ needs.advisory-review.result }}" \
            --eval-result "${{ needs.eval-gate.result }}" \
            --integrity-result "${{ needs.pipeline-integrity.result }}" \
            --artifacts ci-artifacts

      - name: Upload audit trail
        uses: actions/upload-artifact@v4
        with:
          name: audit-trail
          path: |
            ci-audit-trail-*.json
            ci-audit-summary.md
          retention-days: 90
          if-no-files-found: error

      - name: Post audit summary
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upsert_pr_comment.py "${{ github.event.pull_request.number }}" "<!-- ci:audit-summary -->" ci-audit-summary.md
